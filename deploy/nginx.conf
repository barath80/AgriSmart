# AgriSmart edge: one load balancer in front of N identical, stateless API instances.
# This is the edge, so it *sets* X-Forwarded-For to the real peer address. If a cloud load
# balancer sits in front, enable ngx_http_realip_module (set_real_ip_from <LB range>) first.
# Terminate TLS here (or at a cloud load balancer in front of this) — the API is HTTPS-only
# in production.

worker_processes auto;
events { worker_connections 4096; }

http {
    # Docker's DNS: lets "api" resolve to every replica of the api service.
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    server_tokens off;
    client_max_body_size 8m;              # photos ≤ 6 MB, audio ≤ 4 MB (also enforced by the API)

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    log_format timed '$remote_addr "$request" $status $body_bytes_sent '
                     'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time rid=$request_id';
    access_log /dev/stdout timed;

    # Coarse per-IP flood protection only. Mobile carriers put thousands of farmers behind
    # one IP (CGNAT), so this is generous; per-farmer limits are enforced in the API.
    limit_req_zone $binary_remote_addr zone=per_ip:20m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    upstream api {
        # Least-connections spreads slow requests (inference, speech) better than round-robin.
        least_conn;
        zone api_upstream 64k;            # shared state, required for "resolve"
        # "resolve" re-reads Docker DNS, so `docker compose up --scale api=N` takes effect
        # without restarting nginx.
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;                     # reuse upstream connections instead of reconnecting
    }

    upstream admin {
        zone admin_upstream 64k;
        server admin:3000 resolve;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80;
        server_name _;

        # One ID per request end to end: nginx creates it, the API logs and echoes it.

        location = /health { proxy_pass http://api; proxy_set_header X-Request-ID $request_id; }
        location = /ready  { proxy_pass http://api; proxy_set_header X-Request-ID $request_id; }
        # Prometheus metrics stay inside the private network.
        location = /metrics { deny all; }

        # Telephony media stream: long-lived WebSocket, no buffering.
        location /api/v1/voice/telephony/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: clients cannot spoof their IP
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;      # > MAX_CALL_SECONDS
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=per_ip burst=400 nodelay;
            limit_conn conn_per_ip 500;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: clients cannot spoof their IP
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            # Retry another instance only for idempotent requests that never reached the app.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        location / {
            proxy_pass http://admin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: clients cannot spoof their IP
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
