# AgriSmart production-shaped stack on one machine:
#
#   internet → nginx (load balancer) → api × N (stateless)  → PostgreSQL
#                                     → admin (Next.js)      ↗
#              worker (notifications, scheduled alerts)  ──┘
#
#   cp deploy/.env.example deploy/.env      # fill in secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml up -d --scale api=4   # scale out
#
# Trained models are mounted read-only from ml/artifacts.

name: agrismart

x-api-env: &api-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://agrismart:${POSTGRES_PASSWORD}@postgres:5432/agrismart
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGINS: ${PUBLIC_ADMIN_URL}
  MODEL_DIR: /models
  ML_MAX_CONCURRENCY: ${ML_MAX_CONCURRENCY:-2}
  MARKET_PROVIDER: ${MARKET_PROVIDER:-import}
  DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
  SCHEME_PROVIDER: ${SCHEME_PROVIDER:-verified_file}
  MYSCHEME_API_KEY: ${MYSCHEME_API_KEY:-}
  VOICE_PROVIDER: ${VOICE_PROVIDER:-none}
  SARVAM_API_KEY: ${SARVAM_API_KEY:-}
  BHASHINI_USER_ID: ${BHASHINI_USER_ID:-}
  BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-none}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}   # farmers sign in with a password; twilio is optional
  TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
  LOG_LEVEL: INFO

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrismart
      POSTGRES_USER: agrismart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Budget: api replicas × WEB_CONCURRENCY × (DB_POOL_SIZE + DB_MAX_OVERFLOW) + worker + admin
    # 4 × 2 × 15 = 120  (+ migrations/worker)  < 200
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrismart -d agrismart"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations and load reference data before the API starts.
  migrate:
    build: ../backend
    environment: *api-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ../backend
    image: agrismart-api
    restart: unless-stopped
    environment:
      <<: *api-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      FORWARDED_ALLOW_IPS: "*"        # only nginx can reach the api network
    volumes:
      - ../ml/artifacts:/models:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: ${API_REPLICAS:-3}
      resources:
        limits: { cpus: "2", memory: 1500M }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose: ["8000"]

  worker:
    image: agrismart-api
    restart: unless-stopped
    environment: *api-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      api: { condition: service_started }

  admin:
    build: ../admin
    restart: unless-stopped
    environment:
      AGRISMART_API_URL: http://api:8000   # private network; Docker DNS spreads calls over replicas
    expose: ["3000"]

  nginx:
    image: nginx:1.28-alpine   # ≥ 1.27.3: upstream "resolve" follows replica changes
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api: { condition: service_healthy }
      admin: { condition: service_started }

volumes:
  pgdata:
