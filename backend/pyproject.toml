[project]
name = "agrismart-backend"
version = "1.0.0"
description = "AgriSmart API — voice-first agricultural assistance for Indian farmers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pillow>=10.4",
    "xgboost>=2.1",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "onnx>=1.16",  # builds tiny test models
    "psutil>=6",   # load test: server CPU sampling
    "imageio-ffmpeg>=0.5",  # static ffmpeg for decoding m4a/webm recordings without a system install
]
# Offline speech recognition for the LocalModelProvider (CPU friendly).
local-voice = ["faster-whisper>=1.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = [
    "B008",     # FastAPI Depends() in defaults is idiomatic
    "UP046",    # Generic[T] reads clearer than PEP 695 for Pydantic models
    "UP047",
    "ASYNC109", # explicit per-call HTTP timeouts are intended
]
